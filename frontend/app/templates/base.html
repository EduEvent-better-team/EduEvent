<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Each page can set its own browser tab title. -->
    <title>{% block title %}EduEvent{% endblock %}</title>
</head>
<body>
    <header>
        <h1>EduEvent</h1>

        <nav aria-label="Main navigation">
            <a href="{% url 'core:home' %}">Home</a>
        </nav>
    </header>

    <main>
        <!-- Templates extending this file provide their content here. -->
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>EduEvent — Software Engineering Project</p>
    </footer>
</body>
</html>
